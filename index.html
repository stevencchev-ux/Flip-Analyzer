<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCOLINEMGMT — Deal Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root {
    --bg: #080c14;
    --surface: #0e1520;
    --surface2: #131d2e;
    --border: #1e2d45;
    --border2: #243552;
    --text: #e8edf5;
    --muted: #7a8aaa;
    --hint: #435070;
    --accent: #4a9eff;
    --accent-dim: #2a6abf;
    --green: #40c080;
    --green-dim: #1a5035;
    --danger: #f06060;
    --warn: #f0a840;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --r: 6px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.6; min-height: 100vh; }

  header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 1rem; }
  header .logo { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); }
  header .sep { color: var(--hint); }
  header .tagline { font-size: 12px; color: var(--muted); }

  .wrap { max-width: 680px; margin: 0 auto; padding: 2rem 1.5rem; }

  .section-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--hint); margin-bottom: 0.75rem; margin-top: 1.5rem; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.5rem; margin-bottom: 1.25rem; }
  .card-title { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 1rem; letter-spacing: 0.05em; }

  .fields-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.875rem; }
  .fields-grid.single { grid-template-columns: 1fr; }
  @media (max-width: 480px) { .fields-grid { grid-template-columns: 1fr; } }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--hint); }
  .field input, .field textarea, .field select {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
    width: 100%;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent-dim); }
  .field textarea { resize: vertical; min-height: 80px; font-family: var(--sans); font-size: 13px; }
  .field input::placeholder, .field textarea::placeholder { color: var(--hint); }
  .field.span2 { grid-column: span 2; }
  @media (max-width: 480px) { .field.span2 { grid-column: span 1; } }

  .btn { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; border: none; border-radius: var(--r); padding: 11px 20px; cursor: pointer; transition: opacity 0.15s; white-space: nowrap; width: 100%; margin-top: 1rem; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover:not(:disabled) { opacity: 0.85; }
  .btn-ghost { background: var(--surface2); border: 1px solid var(--border2); color: var(--muted); margin-top: 0.5rem; }
  .btn-ghost:hover:not(:disabled) { color: var(--accent); border-color: var(--accent-dim); }

  .status { font-family: var(--mono); font-size: 11px; padding: 0.75rem 1rem; border-radius: var(--r); margin-top: 1rem; display: none; }
  .status.show { display: block; }
  .status.loading { background: rgba(74,158,255,0.08); border: 1px solid var(--accent-dim); color: var(--accent); }
  .status.success { background: rgba(64,192,128,0.08); border: 1px solid var(--green-dim); color: var(--green); }
  .status.error { background: rgba(240,96,96,0.08); border: 1px solid #6a2020; color: var(--danger); }

  .info-box { background: rgba(74,158,255,0.05); border: 1px solid var(--border); border-radius: var(--r); padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  .info-box p { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .info-box strong { color: var(--accent); }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
</style>
</head>
<body>

<header>
  <span class="logo">SCOLINEMGMT</span>
  <span class="sep">·</span>
  <span class="tagline">On-Demand Deal Analyzer</span>
</header>

<div class="wrap">

  <div class="info-box">
    <p>Enter the deal details below and hit <strong>Submit for Analysis</strong>. The pipeline will pull comps, run the numbers, and send the full underwriting sheet to your inbox — usually within 2–3 minutes.</p>
  </div>

  <div class="card">
    <div class="card-title">Property Details</div>
    <div class="fields-grid">
      <div class="field span2">
        <label>Property Address *</label>
        <input type="text" id="address" placeholder="e.g. 2002 N Studebaker Rd, Long Beach, CA 90815" />
      </div>
      <div class="field">
        <label>Purchase Price ($) *</label>
        <input type="number" id="price" placeholder="829000" />
      </div>
      <div class="field">
        <label>Wholesaler ARV ($)</label>
        <input type="number" id="wsArv" placeholder="optional" />
      </div>
      <div class="field">
        <label>Beds *</label>
        <input type="number" id="beds" placeholder="3" />
      </div>
      <div class="field">
        <label>Baths *</label>
        <input type="number" id="baths" placeholder="2" step="0.5" />
      </div>
      <div class="field">
        <label>Sqft *</label>
        <input type="number" id="sqft" placeholder="1169" />
      </div>
      <div class="field">
        <label>Year Built</label>
        <input type="number" id="yearBuilt" placeholder="1953" />
      </div>
      <div class="field">
        <label>Lot Size (sqft)</label>
        <input type="number" id="lotSize" placeholder="6680" />
      </div>
      <div class="field">
        <label>COE Date</label>
        <input type="text" id="coe" placeholder="e.g. 09/17/2026" />
      </div>
      <div class="field">
        <label>EMD ($)</label>
        <input type="number" id="emd" placeholder="40000" />
      </div>
      <div class="field">
        <label>Vendor / Source</label>
        <input type="text" id="vendor" placeholder="e.g. Acquired, Direct, Text" />
      </div>
      <div class="field span2">
        <label>Notes (condition, pool, garage, etc.)</label>
        <textarea id="notes" placeholder="e.g. Cosmetic fixer, pool, 2-car garage, corner lot..."></textarea>
      </div>
    </div>

    <button class="btn btn-primary" id="submitBtn">Submit for Analysis</button>
    <button class="btn btn-ghost" onclick="clearForm()">Clear</button>

    <div class="status" id="status"></div>
  </div>

</div>

<script>
  // EmailJS config — fill in your EmailJS public key, service ID, and template ID
  const EMAILJS_PUBLIC_KEY  = '4bl22ITTNQ4zUgFFA';
  const EMAILJS_SERVICE_ID  = 'service_59gejpr';
  const EMAILJS_TEMPLATE_ID = 'template_lha3xic';
  const TARGET_EMAIL        = 'STEVENCHEV@SCOLINEMGMT.onmicrosoft.com';

  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

  function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.className = 'status show ' + type;
    el.innerHTML = msg;
  }

  function clearForm() {
    ['address','price','wsArv','beds','baths','sqft','yearBuilt','lotSize','coe','emd','vendor','notes']
      .forEach(id => document.getElementById(id).value = '');
    const el = document.getElementById('status');
    el.className = 'status';
    el.innerHTML = '';
  }

  async function submitDeal() {
    if (isSubmitting) return;
    isSubmitting = true;

    const address  = document.getElementById('address').value.trim();
    const price    = document.getElementById('price').value.trim();
    const beds     = document.getElementById('beds').value.trim();
    const baths    = document.getElementById('baths').value.trim();
    const sqft     = document.getElementById('sqft').value.trim();
    const wsArv    = document.getElementById('wsArv').value.trim();
    const yearBuilt= document.getElementById('yearBuilt').value.trim();
    const lotSize  = document.getElementById('lotSize').value.trim();
    const coe      = document.getElementById('coe').value.trim();
    const emd      = document.getElementById('emd').value.trim();
    const vendor   = document.getElementById('vendor').value.trim() || 'Direct';
    const notes    = document.getElementById('notes').value.trim();

    if (!address || !price || !beds || !baths || !sqft) {
      setStatus('⚠ Please fill in address, purchase price, beds, baths, and sqft.', 'error');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    setStatus('<span class="spinner"></span>Submitting deal for analysis...', 'loading');

    // Build email body that Claude extract prompt can parse
    const emailBody = `New Deal Analysis Request

Address: ${address}
Purchase Price: $${Number(price).toLocaleString()}
Beds: ${beds}
Baths: ${baths}
Square Feet: ${sqft}
Year Built: ${yearBuilt || 'Unknown'}
Lot Size: ${lotSize ? lotSize + ' sqft' : 'Unknown'}
${wsArv ? 'Projected ARV: $' + Number(wsArv).toLocaleString() : ''}
${coe ? 'COE: ' + coe : ''}
${emd ? 'EMD: $' + Number(emd).toLocaleString() : ''}
Vendor: ${vendor}
${notes ? 'Notes: ' + notes : ''}

Submitted via SCOLINEMGMT Deal Analyzer`;

    const subject = `Deal Analysis — ${address}`;

    try {
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        to_email: TARGET_EMAIL,
        subject:  subject,
        message:  emailBody,
        from_name: 'SCOLINEMGMT Deal Analyzer'
      });

      setStatus(
        '✓ Deal submitted successfully! The underwriting sheet will arrive in your inbox within 2–3 minutes.',
        'success'
      );
      isSubmitting = false;
      btn.disabled = false;

    } catch(err) {
      setStatus('✗ Failed to submit: ' + (err.text || err.message || 'Unknown error'), 'error');
      isSubmitting = false;
      btn.disabled = false;
    }
  }

  // Prevent double submit
  let isSubmitting = false;

  document.getElementById('submitBtn').addEventListener('click', function(e) {
    e.preventDefault();
    if (isSubmitting) return;
    submitDeal();
  });

  // Enter key on address field triggers submit
  document.getElementById('address').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!isSubmitting) submitDeal();
    }
  });
</script>
</body>
</html>
